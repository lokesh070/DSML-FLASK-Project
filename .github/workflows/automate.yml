name: Running tests on push to main

# trigger
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: ['main']

#group off the job to run
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4    # workflow will have access of the files in the repository
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run test cases
        run:
          pytest test_web_app.py