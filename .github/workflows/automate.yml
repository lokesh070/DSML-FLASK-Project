name: Running tests on push to main

# trigger
on:
  push:
    branches: [ "main" ]

#group off the job to run
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4    # workflow will have access of the files in the repository
      - name: Set up Python 3.13
        uses: actions/setup-python@v3
        with:
            python-version: "3.13"
      - name: Install Dependencies
        run:
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test cases
        run:
          pytest test_web_app.py