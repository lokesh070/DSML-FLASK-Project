name: Running tests on push to main and deploying to ECS

# trigger
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: ['main']

#group off the job to run
jobs:
  job1:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4    # workflow will have access of the files in the repository
        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install pytest
        - name: Run test cases
          run:
            pytest test_web_app.py

  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Giving access to repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # access secret key
          aws-secret-access-key: ${{ secrets.ACCESS_SECRET_ID }} # access secret key from github
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: loanapp-cd
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: loanapp-cd
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: loanapp-ci-cd-task-service
          cluster: loanapp-ci-cd
          wait-for-service-stability: true


